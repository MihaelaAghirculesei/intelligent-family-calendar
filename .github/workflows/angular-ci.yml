name: Angular CI

on:
  push:
    paths: ["angular-version/**", ".github/workflows/angular-ci.yml"]
  pull_request:
    paths: ["angular-version/**", ".github/workflows/angular-ci.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: angular-version

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: angular-version/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Production build
        run: npx ng build --configuration production

      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless
