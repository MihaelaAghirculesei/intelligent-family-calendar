name: Deploy demo

# Publishes the English and Italian builds to GitHub Pages. Visitors start
# with the fictitious demo family; their changes stay in their own browser.
on:
  push:
    branches: [main]
    paths: ["angular-version/**", ".github/workflows/deploy-demo.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular-version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: angular-version/package-lock.json

      - run: npm ci

      - name: Build both languages for the Pages URL
        run: npx ng build --configuration production --base-href /intelligent-family-calendar/

      - name: Send the site root to the English version
        run: |
          printf '<!doctype html><meta charset="utf-8"><title>Intelligent Family Calendar</title><meta http-equiv="refresh" content="0; url=en-US/"><a href="en-US/">Open the demo</a>\n' \
            > dist/intelligent-family-calendar-angular/browser/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: angular-version/dist/intelligent-family-calendar-angular/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
