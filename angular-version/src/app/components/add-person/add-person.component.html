<div class="modal-overlay" *ngIf="isVisible" (click)="hide()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Aggiungi Nuova Persona</h2>
      <button class="close-btn" (click)="hide()">&times;</button>
    </div>
    
    <form [formGroup]="personForm" (ngSubmit)="onSubmit()" class="person-form">
      <div class="form-group">
        <label for="name">Nome Persona *</label>
        <input 
          id="name" 
          type="text" 
          formControlName="name" 
          placeholder="Es. Marco, Sofia..."
          [class.error]="personForm.get('name')?.invalid && personForm.get('name')?.touched">
        <div class="error-message" *ngIf="getFieldError('name')">
          {{ getFieldError('name') }}
        </div>
      </div>

      <div class="form-group">
        <label for="color">Colore *</label>
        <div class="color-selection">
          <div class="color-grid">
            <button 
              type="button"
              *ngFor="let color of predefinedColors" 
              class="color-option"
              [class.selected]="personForm.get('color')?.value === color"
              [style.background-color]="color"
              (click)="selectColor(color)">
            </button>
          </div>
          <div class="custom-color">
            <label for="customColor">O scegli un colore personalizzato:</label>
            <input 
              id="customColor"
              type="color" 
              formControlName="color"
              class="color-picker">
          </div>
        </div>
        <div class="color-preview">
          <div class="preview-box" [style.background-color]="personForm.get('color')?.value">
            <span>{{ personForm.get('name')?.value || 'Anteprima' }}</span>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="hide()">
          Annulla
        </button>
        <button type="submit" class="btn-primary" [disabled]="personForm.invalid">
          Aggiungi Persona
        </button>
      </div>
    </form>
  </div>
</div>
