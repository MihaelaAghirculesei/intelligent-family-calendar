@if (isVisible()) {
  <div class="modal-overlay" (click)="hide()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2 i18n>Add new person</h2>
        <button class="close-btn" (click)="hide()" aria-label="Close" i18n-aria-label>&times;</button>
      </div>
    
      <form [formGroup]="personForm" (ngSubmit)="onSubmit()" class="person-form">
        <div class="form-group">
          <label for="name" i18n>Name *</label>
          <input 
            id="name" 
            type="text" 
            formControlName="name" 
            placeholder="E.g. Anna, Leo..."
            i18n-placeholder
            [class.error]="personForm.get('name')?.invalid && personForm.get('name')?.touched">
          @if (getFieldError('name')) {
            <div class="error-message">
              {{ getFieldError('name') }}
            </div>
          }
        </div>

        <div class="form-group">
          <label for="color" i18n>Color *</label>
          <div class="color-selection">
            <div class="color-grid" role="group" aria-label="Color" i18n-aria-label>
              @for (color of predefinedColors; track color) {
                <button
                  type="button"
                  class="color-option"
                  [class.selected]="personForm.get('color')?.value === color"
                  [attr.aria-pressed]="personForm.get('color')?.value === color"
                  [attr.aria-label]="colorLabel(color)"
                  [style.background-color]="color"
                  (click)="selectColor(color)">
                </button>
              }
            </div>
            <div class="custom-color">
              <label for="customColor" i18n>Or pick a custom color:</label>
              <input 
                id="customColor"
                type="color" 
                formControlName="color"
                class="color-picker">
            </div>
          </div>
          <div class="color-preview">
            <div class="preview-box"
                 [style.background-color]="personForm.get('color')?.value"
                 [style.color]="previewTextColor()">
              <span>{{ personForm.get('name')?.value || previewLabel }}</span>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secondary" (click)="hide()" i18n>
            Cancel
          </button>
          <button type="submit" class="btn-primary" [disabled]="personForm.invalid" i18n>
            Add person
          </button>
        </div>
      </form>
    </div>
  </div>
}
