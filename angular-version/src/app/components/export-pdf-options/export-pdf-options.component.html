@if (isVisible) {
  <div class="modal-overlay" (click)="hide()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>📄 Esporta PDF</h2>
        <button class="close-btn" (click)="hide()">&times;</button>
      </div>
      <div class="export-form">
        <label class="option-row">
          <input type="checkbox" [(ngModel)]="includeWeekend">
          Includi sabato e domenica
        </label>
        <p class="hint">
          Il PDF riempie sempre un foglio A4 orizzontale. Senza il weekend, le colonne da lunedì a venerdì diventano più larghe.
        </p>
        <div class="form-actions">
          <button type="button" class="btn-secondary" (click)="hide()">Annulla</button>
          <button type="button" class="btn-primary" (click)="onConfirm()">📄 Esporta</button>
        </div>
      </div>
    </div>
  </div>
}
