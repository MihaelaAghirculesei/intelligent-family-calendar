@if (isVisible()) {
  <div class="modal-overlay" (click)="hide()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2 i18n>📄 Export PDF</h2>
        <button class="close-btn" (click)="hide()" aria-label="Close" i18n-aria-label>&times;</button>
      </div>
      <div class="export-form">
        <label class="option-row" i18n>
          <input type="checkbox" [(ngModel)]="includeWeekend">
          Include Saturday and Sunday
        </label>
        <p class="hint" i18n>
          The PDF always fills a landscape A4 sheet. Without the weekend, the Monday to Friday columns get wider.
        </p>
        <div class="form-actions">
          <button type="button" class="btn-secondary" (click)="hide()" i18n>Cancel</button>
          <button type="button" class="btn-primary" (click)="onConfirm()" i18n>📄 Export</button>
        </div>
      </div>
    </div>
  </div>
}
